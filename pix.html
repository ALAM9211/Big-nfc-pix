<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIG NFC PIX</title><style>body{font-family:system-ui;background:#f0f5f1;color:#173a29;margin:0;padding:24px}.card{max-width:460px;margin:5vh auto;background:white;padding:28px;border-radius:20px;box-shadow:0 8px 30px #163c2212}h1{color:#26774d}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font-size:17px;margin:8px 0}input{border:1px solid #cbd8ce}button{background:#26774d;color:white;border:0;font-weight:700}button:disabled{opacity:.5}.muted{color:#65766b;font-size:14px}.error{color:#aa2929}.qr{text-align:center;margin:20px 0}.qr img{max-width:260px;width:100%}</style></head><body><main class="card"><h1>BIG NFC PIX</h1><div id="app">Carregando empresa...</div><p class="muted">Confira o nome do destinatário e o valor no aplicativo do seu banco antes de confirmar. Esta página não verifica pagamentos.</p></main><script>
const PROJECT_URL='https://mgpbcdqaxfdqgjsirwkc.supabase.co';
const PUBLIC_KEY='sb_publishable_Xg1UVGsOQpqvXFd5J_ZDlA_Tw0qwxtG';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const crc16=s=>{let crc=0xffff;for(const byte of new TextEncoder().encode(s)){crc^=byte<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xffff:(crc<<1)&0xffff;}return crc.toString(16).toUpperCase().padStart(4,'0')};
const tlv=(id,value)=>id+String(new TextEncoder().encode(value).length).padStart(2,'0')+value;
function normalizeReceiverKey(key){const v=String(key||'').trim();const digits=v.replace(/\D/g,'');if(/^\+55\d{11}$/.test(v))return v;if(/^\d{2}9\d{8}$/.test(digits)&&!v.includes('@')&&!v.includes('-'))return '+55'+digits;return v}
function pixPayload(key,name,city,amount){key=normalizeReceiverKey(key);const merchant=tlv('00','br.gov.bcb.pix')+tlv('01',key);const normalizedName=(name||'RECEBEDOR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9 .-]/g,' ').trim().slice(0,25)||'RECEBEDOR';const normalizedCity=(city||'BRASIL').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9 .-]/g,' ').trim().slice(0,15)||'BRASIL';let p=tlv('00','01')+tlv('26',merchant)+tlv('52','0000')+tlv('53','986');if(amount!=null)p+=tlv('54',amount.toFixed(2));p+=tlv('58','BR')+tlv('59',normalizedName)+tlv('60',normalizedCity)+tlv('62',tlv('05','***'))+'6304';return p+crc16(p)}
async function init(){try{const slug=new URLSearchParams(location.search).get('loja');if(!slug||!/^[a-z0-9-]{1,80}$/.test(slug))throw Error('Link da empresa inválido.');const url=PROJECT_URL+'/rest/v1/empresas?select=nome,slug,chave_pix,cidade,ativo,modo_valor,valor_fixo&slug=eq.'+encodeURIComponent(slug)+'&ativo=eq.true&limit=1';const res=await fetch(url,{headers:{'apikey':PUBLIC_KEY,'Authorization':'Bearer '+PUBLIC_KEY}});if(!res.ok)throw Error('Não foi possível consultar a empresa ('+res.status+').');const list=await res.json();if(!list.length)throw Error('Empresa não encontrada ou desativada.');const e=list[0];app.innerHTML='<h2>'+esc(e.nome)+'</h2><label for="valor">Valor do pagamento (R$)</label><input id="valor" inputmode="decimal" placeholder="Ex.: 45,00"><button id="gerar">Gerar Pix</button><div id="saida"></div>';const field=document.getElementById('valor');const fixed=e.modo_valor==='fixo'?e.valor_fixo:null;if(e.modo_valor==='fixo'){const n=Number(fixed);if(!Number.isFinite(n)||n<=0||n>99999999.99)throw Error('Valor fixo da empresa inválido.');field.value=n.toFixed(2).replace('.',',');field.readOnly=true;field.setAttribute('aria-label','Valor fixo definido pela empresa');}document.getElementById('gerar').onclick=()=>{const amount=Number(field.value.trim().replace(/\./g,'').replace(',','.'));const out=document.getElementById('saida');if(!Number.isFinite(amount)||amount<=0||amount>99999999.99){out.innerHTML='<p class="error">Informe um valor válido maior que zero.</p>';return;}try{const payload=pixPayload(e.chave_pix,e.nome,e.cidade,amount);out.innerHTML='<p><strong>Pix copia e cola</strong></p><textarea id="codigo" readonly style="width:100%;height:100px">'+esc(payload)+'</textarea><button id="copiar">Copiar código Pix</button><div class="qr" id="qr"></div><p class="muted">Antes de pagar, confira no banco o destinatário e o valor.</p>';document.getElementById('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(payload);alert('Código copiado!')}catch{document.getElementById('codigo').select();alert('Selecione e copie o código acima.')}};const qr=document.createElement('img');qr.alt='QR Code Pix';qr.src='https://api.qrserver.com/v1/create-qr-code/?size=260x260&data='+encodeURIComponent(payload);qr.onerror=()=>{document.getElementById('qr').textContent='QR Code indisponível. Use o Pix copia e cola.'};document.getElementById('qr').appendChild(qr);}catch(err){out.innerHTML='<p class="error">'+esc(err.message)+'</p>'}};}catch(err){app.innerHTML='<p class="error">'+esc(err.message)+'</p>'}}init();
</script></body></html>
