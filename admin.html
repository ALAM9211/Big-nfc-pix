<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIG NFC PIX | Administração</title><style>body{font-family:system-ui;background:#f3f6f5;color:#13261f;margin:0}main{max-width:720px;margin:30px auto;padding:20px}.panel{background:white;padding:22px;border-radius:18px;box-shadow:0 5px 25px #1232}h1{color:#087b50}input,button,select{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #cad7d0;border-radius:10px;font-size:16px}button{background:#087b50;color:white;font-weight:700;border:0}button.secondary{background:#e7f2ed;color:#07583a}button.danger{background:#b42318}label{font-size:14px;font-weight:600}.hidden{display:none}.item{padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:10px;overflow-wrap:anywhere}.muted{color:#66776e;font-size:13px}.error{color:#b42318}a{color:#087b50}</style></head><body><main><div class="panel"><h1>BIG NFC PIX</h1><p class="muted">Painel administrativo · acesso restrito</p><p id="status">Conectando…</p><section id="login" class="hidden"><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button>Entrar</button></form></section><section id="dashboard" class="hidden"><button id="logout" class="secondary">Sair</button><h2>Empresas</h2><form id="companyForm"><input type="hidden" id="companyId"><label>Nome da empresa</label><input id="name" maxlength="120" required><label>Identificador do link (sem espaços)</label><input id="slug" pattern="[a-z0-9-]+" maxlength="60" placeholder="minha-loja" required><label>Tipo de chave Pix</label><select id="pixType"><option value="celular">Celular (+55 automático)</option><option value="cpf">CPF</option><option value="cnpj">CNPJ</option><option value="email">E-mail</option><option value="aleatoria">Chave aleatória</option></select><label>Chave Pix</label><input id="pix" maxlength="120" required><p class="muted" id="pixHint">Digite DDD e celular. O +55 será adicionado automaticamente.</p><label>Modelo da placa Pix</label><select id="mode"><option value="livre">Valor livre — cliente escolhe</option><option value="fixo">Valor fixo — definido por você</option></select><div id="fixedBox" class="hidden"><label>Valor fixo (R$)</label><input id="fixedAmount" inputmode="decimal" placeholder="Ex.: 45,00"></div><label>Cidade (opcional)</label><input id="city" maxlength="120"><label><input id="active" type="checkbox" checked style="width:auto"> Empresa ativa</label><button id="save">Salvar empresa</button><button type="button" id="clear" class="secondary">Limpar formulário</button></form><div id="companies"></div></section></div></main><script>
const SUPABASE_URL='https://mgpbcdqaxfdqgjsirwkc.supabase.co';const KEY='sb_publishable_Xg1UVGsOQpqvXFd5J_ZDlA_Tw0qwxtG';const $=id=>document.getElementById(id);let sb;let companies=[];function status(s,error=false){$('status').textContent=s;$('status').className=error?'error':'muted'}function clearForm(){$('companyForm').reset();$('pixType').value='celular';updatePixHint();$('companyId').value='';$('active').checked=true;$('mode').value='livre';$('fixedAmount').value='';updateMode()}
function detectPixType(v){v=String(v||'').trim();if(v.includes('@'))return 'email';if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v))return 'aleatoria';if(v.startsWith('+55'))return 'celular';const d=v.replace(/\D/g,'');if(d.length===14)return 'cnpj';if(d.length===11){return /^\(?\d{2}\)?[\s-]*9\d{4}[\s-]*\d{4}$/.test(v)?'celular':'cpf'}return 'celular'}
function normalizePix(type,value){const v=String(value||'').trim(),d=v.replace(/\D/g,'');if(type==='celular'){const n=d.startsWith('55')&&d.length===13?d.slice(2):d;return /^\d{2}9\d{8}$/.test(n)?'+55'+n:''}if(type==='cpf')return d.length===11?d:'';if(type==='cnpj')return d.length===14?d:'';if(type==='email')return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?v:'';if(type==='aleatoria')return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)?v:'';return ''}
function updatePixHint(){const hints={celular:'Digite DDD e celular. O +55 será adicionado automaticamente.',cpf:'Digite os 11 números do CPF.',cnpj:'Digite os 14 números do CNPJ.',email:'Digite o e-mail cadastrado como chave Pix.',aleatoria:'Cole a chave aleatória completa (UUID).'};$('pixHint').textContent=hints[$('pixType').value]}
$('pixType').addEventListener('change',updatePixHint);function updateMode(){$('fixedBox').classList.toggle('hidden',$('mode').value!=='fixo');$('fixedAmount').required=$('mode').value==='fixo'}$('mode').addEventListener('change',updateMode);updateMode();
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');status('Entre com sua conta autorizada.');return}const {data,error}=await sb.from('administradores').select('usuario_id').eq('usuario_id',session.user.id).maybeSingle();if(error||!data){$('login').classList.add('hidden');$('dashboard').classList.add('hidden');status('Esta conta não tem autorização de administrador.',true);return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');status('Administrador conectado.');await load()}async function load(){const {data,error}=await sb.from('empresas').select('id,nome,slug,chave_pix,cidade,ativo,modo_valor,valor_fixo').order('nome');if(error){status('Erro ao listar empresas: '+error.message,true);return}companies=data||[];const root=$('companies');root.replaceChildren();if(!companies.length){root.textContent='Nenhuma empresa cadastrada.';return}for(const c of companies){const d=document.createElement('div');d.className='item';const h=document.createElement('strong');h.textContent=c.nome;const p=document.createElement('p');p.className='muted';p.textContent=`${c.slug} · ${c.ativo?'Ativa':'Desativada'} · ${c.cidade||'Cidade não informada'}`;const b=document.createElement('button');b.className='secondary';b.textContent='Editar';b.onclick=()=>{$('companyId').value=c.id;$('name').value=c.nome;$('slug').value=c.slug;$('pixType').value=detectPixType(c.chave_pix);updatePixHint();$('pix').value=c.chave_pix;$('city').value=c.cidade||'';$('mode').value=c.modo_valor||'livre';$('fixedAmount').value=c.valor_fixo==null?'':Number(c.valor_fixo).toFixed(2).replace('.',',');updateMode();$('active').checked=c.ativo;scrollTo({top:0,behavior:'smooth'})};const link=document.createElement('a');link.href='pix.html?loja='+encodeURIComponent(c.slug);link.target='_blank';link.rel='noopener';link.textContent='Abrir página Pix';link.style.display='block';link.style.margin='10px 0';d.append(h,p,link,b);root.append(d)}}$('loginForm').onsubmit=async e=>{e.preventDefault();status('Entrando…');const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)status('Falha no login: '+error.message,true);else await boot()};$('logout').onclick=async()=>{await sb.auth.signOut();await boot()};$('clear').onclick=clearForm;$('companyForm').onsubmit=async e=>{e.preventDefault();const payload={nome:$('name').value.trim(),slug:$('slug').value.trim(),chave_pix:normalizePix($('pixType').value,$('pix').value),cidade:$('city').value.trim()||null,ativo:$('active').checked,modo_valor:$('mode').value,valor_fixo:null};if(payload.modo_valor==='fixo'){const raw=$('fixedAmount').value.trim().replace(/\s/g,'');const amount=Number(raw.includes(',')?raw.replace(/\./g,'').replace(',','.'):raw);if(!Number.isFinite(amount)||amount<=0||amount>99999999.99){status('Informe um valor fixo válido maior que zero.',true);return;}payload.valor_fixo=Number(amount.toFixed(2));}if(!payload.chave_pix){status('Chave Pix inválida para o tipo selecionado.',true);return;}const id=$('companyId').value;const {error}=id?await sb.from('empresas').update(payload).eq('id',id):await sb.from('empresas').insert(payload);if(error)status('Erro ao salvar: '+error.message,true);else{status('Empresa salva.');clearForm();await load()}};async function start(){
  const sources=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  for(const source of sources){
    try{
      await new Promise((resolve,reject)=>{
        const script=document.createElement('script');script.src=source;
        const timer=setTimeout(()=>{script.remove();reject(new Error('Tempo limite de carregamento'))},10000);
        script.onload=()=>{clearTimeout(timer);resolve()};
        script.onerror=()=>{clearTimeout(timer);reject(new Error('Falha ao carregar biblioteca'))};
        document.head.appendChild(script);
      });
      if(window.supabase?.createClient)break;
    }catch(e){console.warn(e)}
  }
  if(!window.supabase?.createClient){status('Não foi possível carregar a conexão. Verifique a internet e tente atualizar a página.',true);return}
  try{
    sb=window.supabase.createClient(SUPABASE_URL,KEY);
    await Promise.race([boot(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tempo de conexão esgotado')),15000))]);
  }catch(e){status('Falha na conexão: '+(e.message||'erro desconhecido'),true)}
}
start();
</script></body></html>
